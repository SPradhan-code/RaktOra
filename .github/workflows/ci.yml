name: RaktOra Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Install root dependencies
        run: npm install

      - name: 📦 Install backend dependencies
        run: npm install --prefix backend

      - name: 📦 Install frontend dependencies
        run: npm install --prefix frontend

      - name: 🧪 Run Backend Automated Tests (84 Tests)
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-super-secret-key-minimum-32-characters
          ADMIN_REGISTRATION_SECRET: ci-test-admin-secret-for-verification
          ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: npm test

      - name: 🏗️ Build Frontend Production Bundle (Vite)
        run: npm run build --prefix frontend
