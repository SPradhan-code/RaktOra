name: RaktOra Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm ci || npm install

      - name: 📦 Install backend dependencies
        run: npm ci --prefix backend || npm install --prefix backend

      - name: 📦 Install frontend dependencies
        run: npm ci --prefix frontend || npm install --prefix frontend

      - name: 🧪 Run Backend Automated Tests (90 Tests Across 14 Suites)
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-super-secret-key-minimum-32-characters
          ADMIN_REGISTRATION_SECRET: ci-test-admin-secret-for-verification
          ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
        run: npm test

      - name: 🏗️ Build Frontend Production Bundle (Vite)
        run: npm run build --prefix frontend

      - name: 🛡️ Verify No Real Secrets Committed to Workspace
        run: |
          test ! -f .env || (echo "ERROR: .env file found in repository root!" && exit 1)
          test ! -f backend/.env || (echo "ERROR: .env file found in backend directory!" && exit 1)
          echo "Secret check passed: No committed .env files."
